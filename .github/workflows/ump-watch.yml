# Đặt tại: .github/workflows/ump-watch.yml
name: UMP watch

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # mỗi 15 phút, lệch khỏi phút 00 để đỡ bị trễ
  workflow_dispatch:          # cho phép bấm chạy tay để test

permissions:
  contents: write             # để commit file ump_seen.json

concurrency:
  group: ump-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests beautifulsoup4

      - name: Kiểm tra bài mới
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python ump_watch.py

      - name: Lưu trạng thái
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ump_seen.json
          git diff --staged --quiet || (git commit -m "update seen posts" && git push)
